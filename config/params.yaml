depth_self_filter:
  ros__parameters:
    # Geometry source
    use_collision_meshes: true      # collision meshes are lighter/coarser (preferred)
    # include/exclude default to empty (= all links with geometry). Leave them
    # UNSET rather than writing `[]`: an empty list in a params file breaks
    # ComposableNode loading (launch_ros can't type an empty sequence). Set them
    # only when non-empty, e.g.:
    # include_links: ["torso", "l_upper_arm_link"]
    # exclude_links: ["camera_link", "camera_optical_frame"]

    # Filtering
    depth_margin_m: 0.02            # keep pixels this far IN FRONT of the robot surface
    robot_dilation_px: 2          # grow rendered robot near-surface (grayscale min-
                                  # dilation) to absorb silhouette/calibration error;
                                  # unlike mask_dilation it preserves foreground objects
    mask_dilation_px: 4            # final binary grow of the self-mask
    near_m: 0.02
    far_m: 10.0
    frustum_cull: true              # skip rasterizing links whose bounding box is
                                    # wholly outside the camera frustum (behind the
                                    # camera, past far, or off-frame)

    # Time sync / TF
    tf_timeout_s: 0.05
    time_offset_s: 0.0             # add to image stamp for TF lookup (latency comp)

    # robot_description can be passed here or via the /robot_description topic
    robot_description: ""

    # Intrinsics override (>0 replaces camera_info). Use when the camera's
    # recorded camera_info is wrong/placeholder. Example: Luxonis ToF 33D FFC
    # (640x480, 82.3 deg DFoV) -> nominal fx=fy=457, cx=320, cy=240.
    override_fx: 0.0
    override_fy: 0.0
    override_cx: 0.0
    override_cy: 0.0
    focal_scale: 1.0        # debug: multiply camera_info fx,fy
    publish_debug: false    # publish rendered robot_depth for inspection
